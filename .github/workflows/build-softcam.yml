# Builds softcam.dll (64-bit) and softcam32.dll (32-bit) on GitHub, no Visual Studio needed.
# Library: https://github.com/tshino/softcam  (MIT license)
name: Build softcam DLLs
on: workflow_dispatch
jobs:
  build:
    strategy:
      matrix:
        platform: [x64, Win32]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore packages
        run: nuget restore softcam.sln
      - name: Build
        run: msbuild /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} softcam.sln
      - name: Collect
        shell: bash
        run: |
          mkdir out
          f=$(find . -name softcam.dll -path "*${{ matrix.platform }}*" | head -n 1)
          echo "found: $f"
          if [ "${{ matrix.platform }}" = "x64" ]; then cp "$f" out/softcam.dll; else cp "$f" out/softcam32.dll; fi
      - uses: actions/upload-artifact@v4
        with:
          name: softcam-${{ matrix.platform }}
          path: out/*
